[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vtotp-cli"
version = "0.3.0"
description = "Custom CLI TOTP Authenticator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41.0",
]

[project.scripts]
vtotp = "vtotp.__main__:main"

[project.optional-dependencies]
build = [
    "nuitka>=2.6",
    "zstandard>=0.23",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=24.0",
    "flake8>=7.0",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
target-version = ["py311"]
line-length = 88
